services:
  app:
    build: .
    # Nem indul el automatikusan a gép/Docker indulásakor.
    restart: "no"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # A vendor könyvtár a konténerben marad, a host-on lévő (vagy hiányzó) vendor nem írja felül.
      - vendor:/app/vendor

volumes:
  vendor:
